<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DSContainer Creative Asset</title>
  <style>
    /* Same visual system as template.html (screenshots) and the landing page. */
    :root {
      --bg: #0a0c10;
      --bg2: #10141c;
      --ink: #e8ebf1;
      --muted: #8b93a1;
      --accent: #3ba4ff;
      --accent2: #2563eb;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--bg); }

    .canvas {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    }

    .glow {
      position: absolute;
      z-index: -2;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        color-mix(in srgb, var(--accent2), transparent 66%),
        color-mix(in srgb, var(--accent), transparent 90%) 42%,
        transparent 70%
      );
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.85), transparent 72%);
    }

    /* Everything that must survive cropping lives in the safe area. */
    .safe {
      position: absolute;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .brand { display: flex; align-items: center; gap: 0.32em; }

    .brand img {
      width: 1.5em;
      height: 1.5em;
      border-radius: 22%;
      box-shadow: 0 0.18em 0.6em rgba(37, 99, 235, 0.45);
    }

    .brand span { font-weight: 700; letter-spacing: -0.02em; }

    h1 {
      margin: 0.42em 0 0;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    h1 em {
      font-style: normal;
      background: linear-gradient(90deg, var(--accent), #8ab8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.sub { margin: 0.55em 0 0; color: var(--muted); font-weight: 500; }

    .phone {
      position: absolute;
      z-index: 2;
      border-radius: 140px;
      padding: 27px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03) 55%),
        linear-gradient(145deg, #22262e, #14171d);
      box-shadow: 0 60px 160px rgba(0, 0, 0, 0.65), inset 0 0 0 2px rgba(255, 255, 255, 0.12);
      transform-origin: center bottom;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 130px;
      border: 2px solid rgba(255, 255, 255, 0.07);
      z-index: 3;
    }

    .screen { width: 100%; height: 100%; border-radius: 112px; overflow: hidden; background: var(--bg); }
    .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Darken the phones toward the edges so the copy stays the focal point. */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(10, 12, 16, 0.55) 78%, rgba(10, 12, 16, 0.85));
    }
  </style>
</head>
<body>
  <div class="canvas" id="canvas">
    <div class="grid"></div>
    <div class="glow" id="glow"></div>
    <div id="phones"></div>
    <div class="vignette"></div>
    <div class="safe" id="safe">
      <div class="brand" id="brand"><img id="icon" alt="" /><span>DSContainer</span></div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>

  <script>
    // data: { width, height, safe: {w, h, x, y}, scale, title, sub, icon, phones: [{src, x, y, h, rotate}] }
    window.renderCreative = (data) => {
      const canvas = document.getElementById("canvas");
      Object.assign(canvas.style, { width: `${data.width}px`, height: `${data.height}px` });
      Object.assign(document.body.style, { width: `${data.width}px`, height: `${data.height}px` });

      const glow = document.getElementById("glow");
      Object.assign(glow.style, {
        width: `${data.safe.w * 2.2}px`,
        height: `${data.safe.h * 2.6}px`,
        left: `${data.safe.x + data.safe.w / 2 - data.safe.w * 1.1}px`,
        top: `${data.safe.y + data.safe.h / 2 - data.safe.h * 1.3}px`,
      });

      const safe = document.getElementById("safe");
      Object.assign(safe.style, {
        left: `${data.safe.x}px`, top: `${data.safe.y}px`,
        width: `${data.safe.w}px`, height: `${data.safe.h}px`,
        fontSize: `${data.scale}px`,
      });
      document.getElementById("brand").style.fontSize = "0.62em";
      document.getElementById("icon").src = data.icon;
      const title = document.getElementById("title");
      title.innerHTML = data.title;
      title.style.fontSize = "1.18em";
      const sub = document.getElementById("sub");
      sub.textContent = data.sub;
      sub.style.fontSize = "0.44em";

      const phones = document.getElementById("phones");
      phones.innerHTML = "";
      for (const p of data.phones) {
        const w = p.h * (1320 / 2868) + 54;
        const el = document.createElement("div");
        el.className = "phone";
        Object.assign(el.style, {
          left: `${p.x - w / 2}px`, top: `${p.y}px`,
          width: `${w}px`, height: `${p.h + 54}px`,
          transform: `rotate(${p.rotate}deg)`,
          opacity: p.opacity ?? 1,
          // Outer (tilted, dimmed) phones sit behind the inner ones on both sides.
          zIndex: p.opacity ? 1 : 2,
        });
        el.innerHTML = `<div class="screen"><img src="${p.src}" alt="" /></div>`;
        phones.appendChild(el);
      }
    };
  </script>
</body>
</html>
