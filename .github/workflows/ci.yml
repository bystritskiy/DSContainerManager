name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftFormat & SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install linters
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      # Default rule set, default severities: warnings are reported but do not
      # fail the build; only error-severity violations block CI.
      - name: SwiftLint
        run: swiftlint lint

  build-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build & Test
        run: |
          xcodebuild \
            -project DSContainerManager.xcodeproj \
            -scheme DSContainerManager \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipMacroValidation \
            clean test

  release-build:
    name: Release build (App Store readiness)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Unsigned device build: needs no certificates or secrets, but compiles
      # the exact Release configuration that gets archived and produces the
      # same merged Info.plist the App Store sees.
      - name: Build Release for device (unsigned)
        run: |
          xcodebuild \
            -project DSContainerManager.xcodeproj \
            -scheme DSContainerManager \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ci \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Guards against silently dropping a submission-critical key: each of
      # these is required for the app to work on device or to pass review.
      - name: Verify submission-critical Info.plist keys
        run: |
          set -euo pipefail
          APP="build/ci/Build/Products/Release-iphoneos/DSContainerManager.app"
          PLIST="$APP/Info.plist"

          check() {
            if ! /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" >/dev/null 2>&1; then
              echo "::error::Missing Info.plist key: $1"
              exit 1
            fi
            echo "ok: $1"
          }

          check 'NSAppTransportSecurity:NSAllowsLocalNetworking'
          check 'NSLocalNetworkUsageDescription'
          check 'BGTaskSchedulerPermittedIdentifiers'
          check 'UIBackgroundModes'
          check 'ITSAppUsesNonExemptEncryption'

          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "::error::Missing PrivacyInfo.xcprivacy in the app bundle"
            exit 1
          fi
          echo "ok: PrivacyInfo.xcprivacy"
